server {
    listen 80;
    server_name localhost;

    # --- FIX VITAL PARA DOCKER ---
    # Usamos el DNS interno de Docker (127.0.0.11) para que Nginx pueda
    # resolver nombres dinámicamente. Esto evita que Nginx se muera (Crash)
    # si el contenedor de Java ('core-service') tarda en arrancar.
    resolver 127.0.0.11 valid=30s;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Frontend (Vue Router)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend API
    location /api/ {
        # TRUCO: Usar una variable fuerza a Nginx a resolver el DNS
        # cuando recibe la petición, no cuando arranca el servidor.
        set $upstream_app http://core-service:8080;

        proxy_pass $upstream_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Timeouts extendidos para que la IA tenga tiempo de pensar
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 3. Swagger / OpenAPI (Sacado fuera de /api/ para que funcione)
    location ~ ^/(swagger-ui|v3/api-docs) {
        set $upstream_app http://core-service:8080;
        proxy_pass $upstream_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
