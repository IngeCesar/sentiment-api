services:
  # ==========================================
  # 1. CORE SERVICE (Java Spring Boot)
  # ==========================================
  core:
    image: cesiumflow/core:latest
    container_name: cesium-core
    build:
      context: ./core-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SENTIMENT_API_URL=http://sentiment-engine:5000
    depends_on:
      - sentiment-engine
    restart: always

  # ==========================================
  # 2. SENTIMENT ENGINE (Python FastAPI)
  # ==========================================
  sentiment-engine:
    image: cesiumflow/engine:latest
    container_name: cesium-engine
    build:
      context: ./data-science
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    restart: always

  # ==========================================
  # 3. FRONTEND (Nginx Static)
  # ==========================================
  frontend:
    image: cesiumflow/frontend:latest
    container_name: cesium-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always

# ==========================================
# 4. VOLUMES
# ==========================================
volumes:
  maven_data:
