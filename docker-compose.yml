services:
  # --- CAPA DE PERSISTENCIA ---
  sentiment-db:
    image: postgres:15-alpine
    container_name: cesium-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-local=scram-sha-256 --auth-host=scram-sha-256
    healthcheck:
      # Sincronización de estado para servicios dependientes.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

  # --- ORQUESTADOR CORE (SPRING WEBFLUX) ---
  core-service:
    image: cesiumflow/core:latest
    container_name: cesium-core
    build:
      context: ./core-service
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:8080"
    environment:
      - PYTHON_ENGINE_URL=http://sentiment-engine:5000
      - DB_URL=r2dbc:postgresql://sentiment-db:5432/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      # Orquestación basada en 'health readiness' para evitar fallos de conexión en el arranque.
      sentiment-engine:
        condition: service_healthy
      sentiment-db:
        condition: service_healthy
    restart: always

  # --- MOTOR DE INFERENCIA (FASTAPI) ---
  sentiment-engine:
    image: cesiumflow/engine:latest
    container_name: cesium-engine
    build:
      context: ./data-science
      dockerfile: Dockerfile
      target: production
    ports:
      - "5000:5000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
    healthcheck:
      # Validación del stack NLP antes de habilitar el upstream.
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  # --- CAPA DE BORDE (EDGE) ---
  frontend:
    image: cesiumflow/frontend:latest
    container_name: cesium-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    depends_on:
      - core-service
    restart: always

# --- GESTIÓN DE VOLÚMENES ---
volumes:
  maven-data: # Persistencia de caché para optimización de builds.
  postgres-data: # Garantía de persistencia ante ciclos de vida de contenedores.
