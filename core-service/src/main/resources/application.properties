# ==========================================
# 1. APPLICATION METADATA
# ==========================================
spring.application.name=Sentiment-Core

# ==========================================
# 2. MONITORING & ACTUATOR
# ==========================================
# Show full health details (including Python and DB status)
management.endpoint.health.show-details=always
# Expose only the health endpoint via web
management.endpoints.web.exposure.include=health

# ==========================================
# 3. DATABASE CONNECTION (REACTIVE R2DBC)
# ==========================================
# Values are injected via Docker/System environment variables.
# Format: ${VARIABLE_NAME:DEFAULT_VALUE}
spring.r2dbc.url=${DB_URL:r2dbc:postgresql://localhost:5432/cesium_sentiment_db}
spring.r2dbc.username=${DB_USER:cesium_user}
spring.r2dbc.password=${DB_PASSWORD:cesium_password}

# ==========================================
# 4. LOGGING CONFIGURATION
# ==========================================
# Helpful for debugging SQL queries in the console
logging.level.org.springframework.data.r2dbc=DEBUG

# ==========================================
# 5. OPENAPI / SWAGGER CONFIGURATION
# ==========================================

# Enable OpenAPI and Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Force the path to avoid NetworkErrors
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.use-root-path=true
springdoc.show-actuator=true