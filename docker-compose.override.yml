services:
  # ==========================================
  # 1. CORE SERVICE (Development Overrides)
  # ==========================================
  core:
    image: cesiumflow/core:dev
    build:
      target: builder
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      # We ensure dev environment variables are present here too
      - DB_URL=r2dbc:postgresql://db:5432/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./core-service:/app
      - maven-data:/root/.m2
    command: mvn spring-boot:run

  # ==========================================
  # 2. DATABASE (Development Persistence)
  # ==========================================
  db:
    # In development, we map the DB data to a local folder
    # so you can easily delete it if you want to reset the DB.
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ==========================================
  # 3. SENTIMENT ENGINE
  # ==========================================
  sentiment-engine:
    image: cesiumflow/engine:dev
    build:
      target: builder
    volumes:
      - ./data-science:/app
    command: uvicorn ds-api.main:app --host 0.0.0.0 --port 5000 --reload

  # ==========================================
  # 4. FRONTEND
  # ==========================================
  frontend:
    image: cesiumflow/frontend:dev
    volumes:
      - ./frontend:/usr/share/nginx/html
